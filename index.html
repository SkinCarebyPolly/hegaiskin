<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HegaiSkin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #3D2010;
    --gold: #D4A853;
    --cream: #FDF8F0;
    --sage: #AAB29A;
    --white: #FAFAFA;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Raleway', sans-serif;
    background: var(--dark);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow-x: hidden;
  }
  .bg-glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(212,168,83,0.15), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(170,178,154,0.12), transparent 50%);
    pointer-events: none;
  }
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  /* BRAND */
  .brand-mark {
    width: 88px; height: 88px;
    margin: 0 auto 24px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--gold);
    background: rgba(212,168,83,0.08);
    animation: fadeDown 0.8s ease;
  }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem;
    font-weight: 600;
    line-height: 1;
    animation: fadeDown 0.9s ease;
  }
  .brand-name span { font-style: italic; color: var(--gold); }
  .tagline {
    font-size: 0.7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--sage);
    margin-top: 12px;
    animation: fadeDown 1s ease;
  }
  .bio {
    font-size: 0.95rem;
    color: rgba(253,248,240,0.75);
    margin: 24px auto 36px;
    max-width: 320px;
    line-height: 1.5;
    animation: fadeDown 1.1s ease;
  }

  /* LINKS */
  .links { display: flex; flex-direction: column; gap: 16px; }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    background: rgba(253,248,240,0.06);
    border: 1.5px solid rgba(212,168,83,0.3);
    border-radius: 18px;
    text-decoration: none;
    color: var(--cream);
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    animation: fadeUp 0.6s ease backwards;
  }
  .link-btn:nth-child(1) { animation-delay: 0.3s; }
  .link-btn:nth-child(2) { animation-delay: 0.45s; }
  .link-btn:nth-child(3) { animation-delay: 0.6s; }
  .link-btn:hover {
    background: rgba(212,168,83,0.15);
    border-color: var(--gold);
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .link-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.3rem;
  }
  .link-icon.waitlist { background: linear-gradient(135deg, var(--gold), #C49640); }
  .link-icon.instagram { background: linear-gradient(135deg, #E1306C, #C13584, #F77737); }
  .link-icon.whatsapp { background: #25D366; }
  .link-text { text-align: left; flex: 1; }
  .link-title { font-weight: 600; font-size: 1rem; }
  .link-sub { font-size: 0.78rem; color: rgba(253,248,240,0.6); margin-top: 2px; }
  .link-arrow { color: var(--gold); font-size: 1.2rem; opacity: 0.6; }

  .featured {
    position: relative;
  }
  .featured::after {
    content: '✨ Vagas limitadas';
    position: absolute;
    top: -10px; right: 16px;
    background: var(--gold);
    color: var(--dark);
    font-size: 0.65rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .footer {
    margin-top: 40px;
    font-size: 0.72rem;
    color: rgba(170,178,154,0.5);
    letter-spacing: 1px;
    animation: fadeUp 0.6s ease 0.8s backwards;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">

  <div class="brand-mark">HS</div>
  <div class="brand-name">Hegai<span>Skin</span></div>
  <div class="tagline">Personalized Skincare</div>

  <p class="bio">A rotina de skincare que usa o que você já tem em casa — personalizada para a sua pele e a sua vida real.</p>

  <div class="links">

    <a href="/lista" class="link-btn featured">
      <div class="link-icon waitlist">📋</div>
      <div class="link-text">
        <div class="link-title">Lista de Espera</div>
        <div class="link-sub">Garanta seu acesso antecipado</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

    <a href="https://instagram.com/hegaiskin" target="_blank" class="link-btn">
      <div class="link-icon instagram">📸</div>
      <div class="link-text">
        <div class="link-title">Instagram</div>
        <div class="link-sub">@hegaiskin</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

    <a href="https://chat.whatsapp.com/CK5ASAh0k7t1e3nt6zsube" target="_blank" class="link-btn">
      <div class="link-icon whatsapp">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2a10 10 0 00-8.5 15.3L2 22l4.8-1.3A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-2.8.7.8-2.7-.2-.3A8 8 0 1112 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.1.1-.3 0-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5a1 1 0 00-.7.3c-.2.3-.9.9-.9 2.1s.9 2.4 1 2.6c.1.2 1.8 2.8 4.4 3.9.6.3 1.1.4 1.5.5.6.2 1.2.2 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1 0-.1-.2-.2-.4-.3z"/></svg>
      </div>
      <div class="link-text">
        <div class="link-title">Grupo Exclusivo</div>
        <div class="link-sub">Comunidade Minha Skin no WhatsApp</div>
      </div>
      <div class="link-arrow">→</div>
    </a>

  </div>

  <div class="footer">HEGAISKIN © 2026</div>

</div>
</body>
</html>
